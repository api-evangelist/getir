crosswalk:
- tool: list_orders
  category: orders
  rest: [postFoodordersActive, postFoodordersPeriodicUnapproved, postFoodordersPeriodicCancelled]
  binding: rest
  confidence: medium
  note: >-
    One tool fans out to three distinct REST operations — active, unapproved and cancelled are
    separate endpoints in the spec, and the tool description ("active/past/scheduled") does not
    say which it calls. There is no single list-orders operation.
- tool: get_order
  category: orders
  rest: [getFoodordersFoodorderid]
  binding: rest
  confidence: high
- tool: accept_order
  category: orders
  rest: [postFoodordersFoodorderidVerify, postFoodordersFoodorderidVerifyscheduled]
  binding: rest
  confidence: medium
  note: >-
    Acceptance splits by order status in the API — status 400 uses /verify, status 325 uses
    /verify-scheduled. A single accept_order tool cannot express that branch.
- tool: reject_order
  category: orders
  rest: [postFoodordersFoodorderidCancel, getFoodordersFoodorderidCanceloptions]
  binding: rest
  confidence: medium
  note: >-
    Cancellation requires a cancel reason; /cancel-options supplies the valid reason set. Error
    59 FoodOrderNotHaveCancelReasonError is raised when the reason is missing.
- tool: list_products
  category: menu
  rest: [getRestaurantsMenu, getRestaurantsOptionproducts]
  binding: rest
  confidence: medium
  note: There is no /products list operation; the menu endpoint is the product listing.
- tool: update_product_availability
  category: menu
  rest: [putProductsProductidStatus, putProductsChainidChainproductidStatus]
  binding: rest
  confidence: high
  note: Two variants — by restaurant product id, or by chain product id.
- tool: update_product_price
  category: menu
  rest: [postChainmenusChainmenuoidUpdateprices]
  binding: rest
  confidence: low
  note: >-
    The public spec exposes price mutation only at CHAIN MENU level
    (POST /chain-menus/{chainMenuOID}/update-prices). No per-product price endpoint exists in
    the published contract, so a per-product price tool has no exact backing operation.
- tool: get_store_status
  category: restaurant
  rest: [getRestaurants, postRestaurantsPosstatus]
  binding: rest
  confidence: medium
  note: >-
    /restaurants returns restaurant information including open/closed state;
    /restaurants/pos-status returns the key POS status. Which one the tool calls is not stated.

