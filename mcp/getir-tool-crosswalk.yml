description: >-
  Binds every tool exposed by the only known Getir MCP server to the GetirFood OpenAPI
  operation(s) that back it, so each tool inherits a REAL input contract from the spec instead
  of a guessed one. The server is community-built and stdio-only, so its live tools/list could
  not be introspected without a partner token — bindings are by name and semantics, and
  confidence is recorded honestly. No tool, field or operation was invented.

