description: 'GetirFood separates test from live by HOST, not by key prefix: the same credential model
  is used against a distinct development gateway. Getir issues both test and live secret keys when a POS/integrator
  company is approved, and provisions a test user plus a test restaurant in the development environment.
  Test orders are placed through a hosted web workspace. All values below are published verbatim by Getir;
  nothing here was invented.'
environments:
- name: production
  base_url: https://food-external-api-gateway.getirapi.com/
  swagger: https://food-external-api-gateway.getirapi.com/swagger.json
- name: test
  base_url: https://food-external-api-gateway.development.getirapi.com
  swagger: https://food-external-api-gateway.development.getirapi.com/swagger.json
  note: A user is created in the test environment for your account to display and configure your restaurant.
separation:
  mechanism: separate host per environment
  key_prefixes: none published
  note: Credentials are issued per environment (test and live) by Getir; there is no in-band test/live
    mode switch.
test_order_workspace:
  url: https://web-workspace.development.getirapi.com/
  default_otp_password: '1234'
  notes:
  - You cannot log in with the username and password given to you — sign up as a real Getir user would
    and add an address to the test account.
  - Masterpass logins take no payment in the development environment.
  - Test restaurants are defined in Arnavutköy Mah. so test couriers can serve; do not change restaurant
    addresses.
  - Select Arnavutköy Mahallesi as your address or restaurants will appear closed.
