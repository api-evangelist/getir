aid: getir
name: Getir
description: >-
  Getir is an Istanbul-based on-demand delivery company, founded in 2015, that pioneered the
  ultrafast "groceries in minutes" model and grew into a super-app spanning rapid grocery
  (Getir), large-basket grocery (GetirBüyük), water (GetirSu), restaurant food delivery
  (GetirYemek / GetirFood) and local-merchant commerce (GetirÇarşı / GetirLocals). Its
  developer-facing surface is a partner-integration platform rather than a public product API:
  Getir publishes the GetirFood API — a Swagger 2.0 contract at
  food-external-api-gateway.getirapi.com covering restaurant onboarding, menu and product
  status, working hours, delivery zones, payment methods and the full food-order lifecycle
  (verify, prepare, handover, deliver, cancel, transfer) — for POS and integrator companies
  that connect restaurant point-of-sale systems to GetirFood. Orders are pushed to partners
  over webhooks, with a documented rate limiter, a 99-entry service error registry, published
  test cards and a dedicated test environment. In February 2026 Uber agreed to acquire Getir's
  Türkiye delivery business, cleared by the Turkish Competition Authority in June 2026.
