apis:
- name: GetirFood API
  description: >-
    The GetirFood (GetirYemek) partner integration API — a Swagger 2.0 contract with 62
    operations across seven tags (auth, restaurants, products, chain-menus, food-orders,
    payment-methods, changelog, health). It lets a POS or integrator company authenticate
    with company + restaurant secret keys, read and mutate restaurant state (open/close,
    working hours, delivery zones, average preparation time, courier service, payment
    methods), manage menu/product and option availability, and drive the food-order
    lifecycle: verify, verify-scheduled, prepare, handover, deliver, cancel, transfer to
    another restaurant, and invoice attachment. New and cancelled orders are pushed to
    partner-hosted webhook URLs; /food-orders/periodic/unapproved and /food-orders/active
    are the documented backup queries.
  humanURL: https://developers.getir.com/food/documentation/giris
  baseURL: https://food-external-api-gateway.getirapi.com
