format: proprietary
description: GetirFood publishes a numeric service-error registry rather than RFC 9457 problem+json. Every
  error response is a JSON envelope carrying a numeric `code`, a PascalCase `error` name and a human `message`;
  validation failures add a `details[]` array and a `source` field naming the offending request part.
  The 99 domain errors below are the published registry; the envelope-level codes were observed live against
  the production gateway.
envelope:
  fields:
    code: Numeric error code — the registry code below, or a negative/gateway code.
    error: PascalCase error name.
    message: Human readable message (English).
    details: Optional array of validation failures (message, path, type, context).
    source: Optional — which part of the request failed validation (e.g. "headers").
  content_type: application/json; charset=utf-8
  observed_example:
    code: -2
    error: ValidationError
    message: '"token" is required'
    source: headers
