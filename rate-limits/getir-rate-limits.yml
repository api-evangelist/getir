docs: https://developers.getir.com/food/documentation/giris
tags:
- Rate Limiting
- Food Delivery
- Point of Sale
description: 'GetirFood enforces a token-scoped rate limiter on the partner gateway. The default budget
  is 300 requests per 60 seconds per token, after which the token is blocked for 20 seconds. Two endpoint
  families carry much tighter budgets: the restaurant/menu read+config surface is capped at 2 requests
  per 60 seconds (30s block) and cancel-options at 40 requests per 600 seconds (60s block). The /periodic
  order-polling endpoints and several order-state transitions are explicitly exempt from the limiter.'
scope: token
exemptions:
- /food-orders/periodic/* endpoints are excluded from the rate limiter.
headers:
  note: No rate-limit response headers are documented, and the Swagger document declares no 429 response.
    Throttling surfaces as a blocked token for the block window.
limits:
- name: Default token budget
  scope: token
  metric: requests
  limit: 300
  timeFrame: 60 seconds
  block: 20 seconds
  applies_to: All rate-limited endpoints unless overridden below.
- name: Restaurant, menu and payment-method configuration surface
  scope: token
  metric: requests
  limit: 2
  timeFrame: 60 seconds
  block: 30 seconds
  applies_to: 21 documented restaurant/*, products/option-products/* configuration operations.
- name: Food order cancel options
  scope: token
  metric: requests
  limit: 40
  timeFrame: 600 seconds
  block: 60 seconds
  applies_to: GET /food-orders/{foodOrderId}/cancel-options
