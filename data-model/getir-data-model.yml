privacy_note: >-
  Order payloads carry consumer PII — name, masked and UNMASKED phone number
  (clientUnmaskedPhoneNumber), full delivery address down to floor/door number, and lat/lon.
  Integrators receive this over the outbound webhook as well as over the REST API.

