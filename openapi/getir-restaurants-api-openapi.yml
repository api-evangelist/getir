          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model22'
  /restaurants/payment-methods/inactive:
    post:
      summary: Inactivate restaurant payment method
      operationId: postRestaurantsPaymentmethodsInactive
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model22'
  /restaurants/average-preparation-time:
    put:
      summary: Update restaurant average preparation time
      operationId: putRestaurantsAveragepreparationtime
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model31'
  /restaurants/delivery-duration/busyness:
    put:
      summary: Update restaurant delivery duration plus 15 min if set True
      operationId: putRestaurantsDeliverydurationBusyness
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model35'
  /restaurants/status/close:
    put:
      summary: Close the restaurant
      operationId: putRestaurantsStatusClose
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model30'
  /restaurants/status/open:
    put:
      summary: Open the restaurant
      operationId: putRestaurantsStatusOpen
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model4'
  /restaurants/zones/{zoneId}/active:
    put:
      summary: Activate restaurant zone status
      operationId: putRestaurantsZonesZoneidActive
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      tags:
