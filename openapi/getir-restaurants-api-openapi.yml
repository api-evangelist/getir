          application/json:
            schema:
              $ref: '#/components/schemas/Model36'
  ? /restaurants/option-products/chain-id/{chainOptionProductId}/option-categories/{chainOptionCategoryId}/options/{chainOptionId}/status
  : put:
      summary: Update option product option status with chain id.
      operationId: putRestaurantsOptionproductsChainidChainoptionproductidOptioncategoriesChainoptioncategoryidOptionsChainoptionidStatus
      description: 'Available status are ACTIVE: 100, INACTIVE: 200<br/><br/>The endpoint will no longer be supported as of January 1, 2025.'
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - description: Chain Option Product's Id
        name: chainOptionProductId
        in: path
        required: true
        schema:
          type: string
      - name: chainOptionCategoryId
        in: path
        required: true
        schema:
          type: string
      - name: chainOptionId
        in: path
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model37'
components:
  schemas:
    Model14:
      type: object
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/name'
        weight:
          type: number
        status:
          type: number
        optionCategories:
          $ref: '#/components/schemas/optionCategories'
        chainOptionProduct:
          type: string
        clientDisplayName:
          $ref: '#/components/schemas/name'
    Model32:
      type: object
      properties:
        posStatus:
          type: number
          enum:
          - 100
          - 200
        appSecretKey:
          type: string
          example: string
          x-format:
            token: true
          x-convert:
            trim: true
        restaurantSecretKey:
          type: string
          example: string
          x-format:
            token: true
          x-convert:
            trim: true
      required:
      - posStatus
      - appSecretKey
      - restaurantSecretKey
    Model15:
      type: array
      items:
        $ref: '#/components/schemas/Model14'
    Model6:
      type: object
      properties:
        id:
          type: string
        product:
          type: string
        chainProduct:
          type: string
        name:
          $ref: '#/components/schemas/name'
        clientDisplayName:
          $ref: '#/components/schemas/name'
        optionProduct:
          type: string
        chainOptionProduct:
          type: string
        optionCategories:
          $ref: '#/components/schemas/tr'
        type:
          type: number
        price:
          type: number
        weight:
          type: number
        status:
          type: number
        chainOption:
          type: string
    name:
      type: object
      properties:
        tr:
          type: string
        en:
          type: string
    workingHours:
      type: object
      properties:
        startTime:
          type: string
          pattern: ^(\d|0\d|1\d|2[0-3]):[0-5]\d$
        endTime:
          type: string
          pattern: ^(\d|0\d|1\d|2[0-3]):[0-5]\d$
    Model7:
      type: array
      items:
        $ref: '#/components/schemas/Model6'
    tr:
      type: array
      items:
        type: string
    Model37:
      type: object
      properties:
        status:
          type: number
          enum:
          - 100
          - 200
    Model16:
      type: object
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/name'
        icon:
          type: string
        paymentGroup:
          type: number
        active:
          type: boolean
        deliveryTypes:
          $ref: '#/components/schemas/deliveryTypes'
        type:
          type: number
        text:
          $ref: '#/components/schemas/name'
    restaurantWorkingHours:
      type: array
      example:
      - day: 0
        closed: true
      - day: 1
        workingHours:
          startTime: 09:00
          endTime: 03:00
      - day: 2
        workingHours:
          startTime: 09:00
          endTime: 02:00
      - day: 3
        workingHours:
          startTime: 09:00
          endTime: '20:00'
      - day: 4
        workingHours:
          startTime: '10:00'
          endTime: '20:00'
      - day: 5
        workingHours:
          startTime: 09:00
          endTime: '20:00'
      - day: 6
        workingHours:
          startTime: 09:00
          endTime: '20:00'
      x-constraint:
        length: 7
        unique: day
      items:
        $ref: '#/components/schemas/Model18'
    Model10:
      type: object
      properties:
        id:
          type: string
        restaurant:
          type: string
        productCategory:
          type: string
        optionCategories:
          $ref: '#/components/schemas/Model9'
        name:
          $ref: '#/components/schemas/name'
        description:
          $ref: '#/components/schemas/name'
        price:
          type: number
        struckPrice:
          type: number
        weight:
          type: number
        status:
          type: number
        isApproved:
          type: boolean
        imageURL:
          type: string
        wideImageURL:
          type: string
        chainProduct:
          type: string
    Model36:
      type: object
      properties:
        eta:
          type: string
        minBasketSize:
          type: number
          minimum: 1
          x-constraint:
            precision: 2
      required:
      - minBasketSize
    Model33:
      type: object
      properties:
        restaurantWorkingHours:
          $ref: '#/components/schemas/restaurantWorkingHours'
    optionCategories:
      type: array
      items:
        $ref: '#/components/schemas/Model4'
    Model19:
      type: object
      properties:
        restaurantWorkingHours:
          $ref: '#/components/schemas/restaurantWorkingHours'
        restaurantCourierHours:
          $ref: '#/components/schemas/restaurantWorkingHours'
    Model35:
      type: object
      properties:
        isBusy:
          type: boolean
        busynessDifferenceDuration:
          type: number
          enum:
          - 15
          - 30
          - 45
    Model17:
      type: array
      items:
        $ref: '#/components/schemas/Model16'
    Model12:
      type: object
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/name'
        restaurant:
          type: string
        products:
          $ref: '#/components/schemas/Model11'
        isApproved:
          type: boolean
        weight:
          type: number
        status:
          type: number
        chainProductCategory:
          type: string
    Model30:
      type: object
      properties:
        timeOffAmount:
          type: number
          enum:
          - 15
          - 30
          - 45
    Model8:
      type: object
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/name'
        minCount:
          type: number
        maxCount:
          type: number
        removeToppings:
          type: boolean
        weight:
          type: number
        status:
          type: number
        chainOptionCategory:
          type: string
        options:
          $ref: '#/components/schemas/Model7'
    Model18:
      type: object
      properties:
        day:
          type: number
          minimum: 0
          maximum: 6
        workingHours:
          $ref: '#/components/schemas/workingHours'
        closed:
          type: boolean
      required:
      - day
    Model3:
      type: object
      properties:
        id:
          type: string
        averagePreparationTime:
          type: number
        status:
          type: number
        isCourierAvailable:
          type: boolean
        name:
          type: string
        isStatusChangedByUser:
          type: boolean
        closedSource:
          type: number
        rating:
          type: number
    Model22:
      type: object
      properties:
        paymentMethodId:
          type: string
      required:
      - paymentMethodId
    Model31:
      type: object
      properties:
        averagePreparationTime:
          type: number
          minimum: 5
          maximum: 90
    Model9:
      type: array
      items:
        $ref: '#/components/schemas/Model8'
    Model4:
      type: object
    Model13:
      type: object
      properties:
        productCategories:
          $ref: '#/components/schemas/productCategories'
    Model23:
      type: object
      properties:
        result:
          type: boolean
    deliveryTypes:
      type: array
      items:
        type: number
    productCategories:
      type: array
      items:
        $ref: '#/components/schemas/Model12'
    Model11:
      type: array
      items:
        $ref: '#/components/schemas/Model10'
