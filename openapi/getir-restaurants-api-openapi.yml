      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model22'
  /restaurants/reviews:
    get:
      summary: Get restaurant reviews
      operationId: getRestaurantsReviews
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: number
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
      tags:
      - restaurants
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /restaurants/working-hours:
