          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model17'
    post:
      summary: Add restaurant payment method
      operationId: postRestaurantsPaymentmethods
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
