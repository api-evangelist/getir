      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /restaurants/zones/{zoneId}/inactive:
    put:
      summary: Activate restaurant zone status
      operationId: putRestaurantsZonesZoneidInactive
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /restaurants/{restaurantId}/zones/{zoneId}:
    put:
      summary: Update zone of a restaurant
      operationId: putRestaurantsRestaurantidZonesZoneid
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      tags:
      - restaurants
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
