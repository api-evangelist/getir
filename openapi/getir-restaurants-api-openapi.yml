          type: string
      tags:
      - restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model22'
    delete:
