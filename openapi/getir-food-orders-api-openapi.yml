  /food-orders/{foodOrderId}/invoice:
    get:
      summary: Get Signed Invoice Photo URL of food order
      operationId: getFoodordersFoodorderidInvoice
      description: You can use this endpoint to get signed url of invoice photo.
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - description: Food Order's Id
        name: foodOrderId
        in: path
        required: true
        schema:
          type: string
      tags:
      - food-orders
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
    post:
      summary: Add Invoice Photo to food order
      operationId: postFoodordersFoodorderidInvoice
      description: You can use this endpoint to add invoice photo for food order.
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - description: Food Order's Id
        name: foodOrderId
        in: path
        required: true
        schema:
          type: string
      tags:
      - food-orders
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Invoice Photo
                  format: binary
              required:
              - file
    delete:
      summary: Delete Invoice Photo from food order
      operationId: deleteFoodordersFoodorderidInvoice
      description: You can use this endpoint to delete invoice photo for food order.
      parameters:
      - description: This token created after login.
        x-convert:
          trim: true
        name: token
        in: header
        required: true
        schema:
          type: string
      - description: Food Order's Id
        name: foodOrderId
        in: path
        required: true
        schema:
          type: string
      tags:
      - food-orders
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
