components:
  schemas:
    Model4:
      type: object
    Model23:
      type: object
      properties:
        result:
          type: boolean
    Model29:
      type: object
      properties:
        targetRestaurantId:
          type: string
    Model28:
      type: object
      properties:
        url:
          type: string
          x-format:
            uri:
              scheme:
              - https
      required:
      - url
    Model27:
      type: object
      properties:
        cancelNote:
          type: string
        cancelReasonId:
          type: string
        productId:
          type: string
