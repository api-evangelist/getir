      - name: restaurantIds
        in: query
        schema:
          type: string
      - name: templateName
        in: query
        schema:
          type: string
          enum:
          - ChainFinancial
          - RestaurantFinancial
      tags:
      - food-orders
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /food-orders/{foodOrderId}/cancel-options:
    get:
      summary: Cancel options of food order
      operationId: getFoodordersFoodorderidCanceloptions
