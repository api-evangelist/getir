- id: hsts
  conforms: false
  evidence: No Strict-Transport-Security header observed on getir.com, developers.getir.com or the API gateway. See security/getir-domain-security.yml.
- id: dnssec
  conforms: false
  evidence: Neither getir.com nor getirapi.com is DNSSEC-signed.
