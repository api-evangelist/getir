- id: oauth2
  conforms: false
  evidence: No oauth2 securityDefinitions in the spec; auth is a proprietary secret-key login returning an opaque `token` header value.
- id: openid-connect
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every Getir host.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server returns 404 on every Getir host.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 (API hosts) or 403 (getir.com) — no security.txt published.
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors use a proprietary {code, error, message, details, source} JSON envelope, not application/problem+json.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header support documented; no deprecation policy published.
- id: rfc7807-problem-details
  conforms: false
